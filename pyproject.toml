[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "passgen"
version = "0.1.0"
description = "A terminal password generator CLI written in Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "textual>=0.70.0",
    "pyperclip>=1.8.2",
]

[project.scripts]
passgen = "passgen.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
